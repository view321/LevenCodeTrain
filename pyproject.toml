[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "levencode"
version = "0.1.0"
description = "Block-diffusion code LM with Levenshtein edit heads, JEPA auxiliary objective, and RLVR hooks, built on LFM2.5-Encoder-350M-Diffusion"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.6",
    "transformers>=4.57,<5",
    "datasets>=3.0",
    "huggingface_hub>=0.26",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pyyaml>=6.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "real_model: requires the downloaded LFM2.5 model weights",
    "network: requires internet access (HF hub)",
]
