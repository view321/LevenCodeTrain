# Levencode base configuration. Stage configs extend this via `_extends: base.yaml`.

model:
  repo_id: LiquidAI/LFM2.5-Encoder-350M-Diffusion
  dtype: auto                # auto -> bf16 on cuda, f32 on cpu
  max_seq_len: 1024
  insert_max: 8              # insertion-count head predicts 0..K masks per gap

run:
  runs_dir: runs
  experiment: levencode      # runs land in runs/<experiment>/<stage>
  seed: 1337
  device: auto               # auto -> cuda if available else cpu

data:
  streaming: true
  shuffle_buffer: 10000
  # Mix weights are sampling probabilities over interleaved streams.
  mix:
    - name: chat
      dataset: HuggingFaceTB/smoltalk
      subset: all
      split: train
      weight: 0.30
      kind: chat
    - name: code_instruct
      dataset: ise-uiuc/Magicoder-OSS-Instruct-75K
      subset: null
      split: train
      weight: 0.25
      kind: magicoder
    - name: math
      dataset: meta-math/MetaMathQA
      subset: null
      split: train
      weight: 0.20
      kind: metamath
    - name: code_raw
      dataset: codeparrot/codeparrot-clean
      subset: null
      split: train
      weight: 0.25
      kind: code_raw

diffusion:
  # Block-pattern masked-diffusion SFT (LLaDA-style objective restricted to a block).
  block_size_min: 16
  block_size_max: 128
  full_answer_prob: 0.30     # fraction of samples trained with the whole answer masked
  t_min: 0.05                # mask-rate lower bound (t ~ U(t_min, 1))
  eos_pad: 16                # eos tokens appended after answers so blocks learn to terminate

corruption:
  p_delete: 0.10             # per-token chance the clean token is dropped
  p_insert: 0.06             # per-gap chance junk tokens are inserted
  p_substitute: 0.05         # per-token chance of substitution (delete + junk insert)
  max_insert_run: 3          # junk insertion run length (uniform 1..max)
  p_span_delete: 0.02        # chance to start a span deletion
  max_span: 8                # span deletion length (uniform 2..max)

train:
  micro_batch_size: 8
  edit_micro_batch_size: null   # edit batches run 3 view forwards; null -> micro_batch_size // 2
  grad_accum: 8
  lr: 3.0e-5
  weight_decay: 0.1
  betas: [0.9, 0.95]
  warmup_steps: 200
  total_steps: 3000
  grad_clip: 1.0
  log_every: 10
  ckpt_every: 1000
  sample_every: 500          # dump generation samples for the WebUI gallery
  loss_weights:
    fill: 1.0
    delete: 0.5
    insert: 0.5
    jepa: 0.0
    delete_pos_weight: 2.0    # junk labels are ~10%; upweight so the head learns to delete
    insert_zero_weight: 0.5   # count-0 gaps are ~90%; downweight so the head learns to insert
    # latent stage (mixture-of-JEPAs) weights
    coarse_ce: 1.0
    fine_ce: 1.0
    coarse_energy: 1.0
    fine_energy: 1.0
    coarse_scorer: 0.5
    fine_scorer: 0.5
    mse: 0.1
    commit: 0.25
    decodability: 1.0
  retain_sft_frac: 0.5       # in edit stages, fraction of batches kept on the SFT objective
  latent_frac: 0.35          # latent stage: fraction of micro-batches on the JEPA stack
  decodability_frac: 0.15    # latent stage: fraction on adapter token-CE decode
  edit_frac: 0.20            # latent stage: fraction keeping the edit heads alive

jepa:
  enabled: false
  predictor_layers: 2
  predictor_heads: 8
  ema_start: 0.996
  ema_end: 0.9995

latent:
  enabled: false
  # Frozen teacher whose pooled hidden states become the latent space. The
  # student never loads this model during training (latents are precomputed).
  teacher: OrionLLM/GRM-3.2-Turf
  store: runs/precompute/demo      # written by scripts/precompute_latents.py
  latent_dim: 2048                 # teacher hidden size (LFM2.5-1.2B)
  # RVQ discrete anchor: R books x codebook_size; the residual is continuous.
  rvq_books: 2
  rvq_codebook_size: 2048
  rvq_ema_decay: 0.99
  rvq_commit: 0.25
  # AR code prior + residual head + energy scorer (per level)
  ar_dim: 512
  ar_layers: 3
  residual_blocks: 3
  energy_hidden: 256
  # decodability adapter (CALM recipe: variational bottleneck + KL clip +
  # dual dropout; token-CE decode through the tied LM head)
  bottleneck_dim: 128
  adapter_layers: 2
  adapter_hidden: 512
  adapter_heads: 8
  max_chunk: 16
  kl_beta: 0.001
  kl_clip: 0.5
  dropout_latent: 0.15
  cfg_dropout: 0.2           # condition dropout for CFG-trained scorer/head
  residual_n_samples: 8
  residual_m_targets: 100
  residual_target_noise: 0.02
  residual_mse: 0.1
  scorer_margin: 1.0
  # data windowing
  ctx_len: 192               # student-encoder context tokens per latent batch
  coarse_window: 4           # coarse chunks per latent batch row
  fine_window: 4             # fine chunks per row (within one coarse chunk)
  rvq_warm_samples: 8192     # stored latents for the RVQ EMA warm-up at trainer init (0 disables)

rollin:
  enabled: false             # roll-in: train edit heads on the model's own outputs
  frac: 0.35                 # fraction of edit micro-batches from the roll-in buffer
  refresh_every: 200         # optimizer steps between buffer regenerations
  buffer_size: 256
  max_len: 512
  mode_mix: 0.5              # P(repair-mode rollout) vs fill-mode rollout
  sampler:
    rounds: 1
    fill_steps: 6
    temperature: 0.7

sampler:
  block_size: 64
  steps_per_block: 16
  max_blocks: 8
  temperature: 0.0           # 0 -> greedy
  top_p: 0.9

edit_sampler:
  # Values from the stage-2 knob sweep (scripts/sweep_repair.py, 2026-08):
  # thr 0.3 / pen 0.0 / rounds 2 lifted self-located repair exact 9% -> 15.6%.
  rounds: 2
  delete_threshold: 0.3
  ins_zero_penalty: 0.0
  fill_steps: 8

latent_sampler:
  # Latent-guided generation: plan codes (discrete anchor) + CFG-scored
  # residual (energy head) + plan-prior block filler + cycle-consistency
  # rejection against the frozen teacher.
  fine_chunk_tokens: 8
  fine_per_coarse: 4
  plan_temperature: 0.8
  plan_top_p: 0.9
  residual_candidates: 8
  cfg_weight: 1.0            # classifier-free guidance on the energy score
  plan_weight: 1.0           # plan logits mixing into the block filler
  fill_steps: 8
  max_coarse_chunks: 6
  code_history: 4            # AR prior history in coarse chunks (match latent.coarse_window)
  cycle_consistency: true
  cycle_threshold: 0.75
  cycle_retries: 2
  max_total_len: 4096

bench:
  at_stage_end: true
  arc_n: 200
  gsm8k_n: 100
  mbpp_n: 50
  chat_loss_n: 64
  repair_n: 40
  infill_n: 40
  gen_max_blocks: 6
  exec_timeout_s: 5.0
  latent_mode: true          # use the latent sampler when the checkpoint has it
  brierlm_n: 16
